</style><rect class="bg" width="1130" height="390" rx="8"/><text x="24" y="30" class="t1" font-size="17" font-weight="700">Amplification after a random-overwrite workload</text><rect class="s0" x="24" y="42" width="12" height="12" rx="3"/><text x="42" y="52" class="t2" font-size="12">NebulaDB</text><rect class="s2" x="174" y="42" width="12" height="12" rx="3"/><text x="192" y="52" class="t2" font-size="12">Pebble v2</text><rect class="s3" x="324" y="42" width="12" height="12" rx="3"/><text x="342" y="52" class="t2" font-size="12">BadgerDB v4</text><text x="24" y="84" class="t1" font-size="14" font-weight="600">Write amplification (engine-accounted)</text><text x="24" y="100" class="t2" font-size="11">WAL + flush + compaction bytes ÷ user bytes; Badger exposes no such counter</text><text x="204" y="126" class="t2" font-size="12" text-anchor="end">nebuladb-size-tiered</text><path class="s0" d="M212.0 114.0 h213.6 a4.0 4.0 0 0 1 4.0 4.0 v6.0 a4.0 4.0 0 0 1 -4.0 4.0 h-213.6 z"><title>nebuladb-size-tiered: 3.9×</title></path><text x="435.6" y="126" class="t1" font-size="12">3.9×</text><text x="204" y="152" class="t2" font-size="12" text-anchor="end">pebble</text><path class="s2" d="M212.0 140.0 h246.4 a4.0 4.0 0 0 1 4.0 4.0 v6.0 a4.0 4.0 0 0 1 -4.0 4.0 h-246.4 z"><title>pebble: 4.5×</title></path><text x="468.4" y="152" class="t1" font-size="12">4.5×</text><text x="204" y="178" class="t2" font-size="12" text-anchor="end">nebuladb</text><path class="s0" d="M212.0 166.0 h278.0 a4.0 4.0 0 0 1 4.0 4.0 v6.0 a4.0 4.0 0 0 1 -4.0 4.0 h-278.0 z"><title>nebuladb: 5.1×</title></path><text x="500.0" y="178" class="t1" font-size="12">5.1×</text><line class="axis" x1="212" y1="110" x2="212" y2="192"/><text x="24" y="234" class="t1" font-size="14" font-weight="600">Space amplification</text><text x="24" y="250" class="t2" font-size="11">allocated directory size ÷ logical live data (lower is better)</text><text x="204" y="276" class="t2" font-size="12" text-anchor="end">pebble</text><pa